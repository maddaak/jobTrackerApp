# Real JPA entity (User) exists as of Phase 2, so tests need a working database --
# H2 in-memory instead of real Postgres, so `mvn test` runs standalone without Docker.
# Mongo's JobDetail repository now exists (see JobDetailRepository) and gets wired into
# JobController's dependency graph, so every @SpringBootTest needs a MongoClient/MongoTemplate
# bean to exist even if it never touches Mongo. The driver connects lazily (no I/O at bean
# creation), so pointing this at a URI with nothing listening is fine for every test except
# ones that actually call a Mongo repository method — JobDetailServiceTests covers that path
# with a mocked repository instead, so no real Mongo server is required to run `mvn test`.
# Note: Spring Boot 4.x moved the connection-level property to spring.mongodb.* (separate
# from spring.data.mongodb.*, which now only covers Spring Data-specific settings).
spring.mongodb.uri=mongodb://localhost:27017/testdb

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt-secret=test-secret-not-for-production-use-only-in-tests
app.jwt-expiry-days=7
app.internal-token=test-internal-token
