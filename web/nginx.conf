server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # nginx's default 1MB body limit would reject resume uploads before they even reach the
    # BFF — matches the 10MB multipart limit set on core/BFF.
    client_max_body_size 10M;

    location ~ ^/(auth|health|jobs|interviews|metrics|scrape|resumes) {
        proxy_pass http://bff:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
