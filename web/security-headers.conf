# Included in the server block and again in any location with its own add_header, since one add_header
# in a location drops every one nginx would otherwise inherit.
#
# Scripts only from this app, so injected markup can't run code. Inline styles stay allowed: charts set
# them, and a style can't run code. blob: is for the CSV and calendar downloads the page builds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# No other site may frame the app to trick a click (frame-ancestors above, for browsers without CSP).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# No Cross-Origin-Opener-Policy: the bookmarklet posts the job page to the tab it opens through
# window.opener, which that header would cut.
# Strict-Transport-Security only with HSTS=true, written at startup by 15-choose-https.sh.
include /etc/nginx/hsts.conf;
