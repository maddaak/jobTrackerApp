spring.application.name=core
server.port=8080
# One user's browser, not 200 concurrent callers; each idle thread still costs a stack.
server.tomcat.threads.max=20
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Flyway owns the schema. Not validate: a pre-v3 database lacks columns until V3Migration adds them.
spring.jpa.hibernate.ddl-auto=none
# A database Hibernate built before Flyway is marked version 0, so V1 still runs over it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# V1's IF NOT EXISTS makes Postgres say "already exists, skipping", which Flyway logs as a warning every first start.
logging.level.org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor=error
spring.mongodb.uri=mongodb://mongo:27017/${MONGO_INITDB_DATABASE}
app.internal-token=${INTERNAL_TOKEN}
app.jwt-secret=${JWT_SECRET}
app.jwt-expiry-days=${JWT_EXPIRY_DAYS}
# Email reminders; a blank host or from address turns them off.
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USERNAME:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.from=${SMTP_FROM:}
app.url=${APP_URL:http://localhost:5173}
app.registration-open=${REGISTRATION_OPEN:false}
spring.servlet.multipart.max-file-size=10MB
# Above max-file-size so multipart framing can't push a legal 10MB file over the request cap.
spring.servlet.multipart.max-request-size=11MB
