# H2 stands in for Postgres so `mvn test` runs without Docker. Tests that hit Mongo use an
# in-memory server (JobControllerTests via InMemoryMongo, JobDetailServiceTests via a mock), so
# this default URI just needs to resolve; the driver connects lazily and never reaches it.
# Spring Boot 4.x reads the connection URI from spring.mongodb.* (not spring.data.mongodb.*).
spring.mongodb.uri=mongodb://localhost:27017/testdb
# Index creation would force that lazy connection to actually resolve at startup.
app.ensure-mongo-indexes=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt-secret=test-secret-not-for-production-use-only-in-tests-hs512-min-64-bytes
app.jwt-expiry-days=7
app.internal-token=test-internal-token
