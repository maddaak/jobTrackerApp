<!DOCTYPE html>
<html>
<head>
<title>Senior Backend Engineer</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "JobPosting",
  "title": "Senior Backend Engineer",
  "description": "We are looking for a Senior Backend Engineer to join our platform team. This role is remote-friendly.",
  "hiringOrganization": {
    "@type": "Organization",
    "name": "Acme Corp"
  },
  "jobLocation": {
    "@type": "Place",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "New York",
      "addressRegion": "NY"
    }
  },
  "baseSalary": {
    "@type": "MonetaryAmount",
    "currency": "USD",
    "value": {
      "@type": "QuantitativeValue",
      "minValue": 150000,
      "maxValue": 190000,
      "unitText": "YEAR"
    }
  }
}
</script>
</head>
<body>
<h1>Senior Backend Engineer</h1>
<p>We are looking for a Senior Backend Engineer to join our platform team. This role is hybrid, 2 days a week in the NYC office.</p>
</body>
</html>
