# H2 stands in for Postgres so `mvn test` runs without Docker. Tests that hit Mongo use an
# in-memory server (JobControllerTests via InMemoryMongo, JobDetailServiceTests via a mock), so
# this default URI just needs to resolve; the driver connects lazily and never reaches it.
# Spring Boot 4.x reads the connection URI from spring.mongodb.* (not spring.data.mongodb.*).
spring.mongodb.uri=mongodb://localhost:27017/testdb
# Index creation, the version backfill, and the location rename would force that lazy connection to
# resolve at startup.
app.ensure-mongo-indexes=false
app.backfill-detail-versions=false
app.convert-pre-v4-locations=false
# Tests call ReminderService themselves rather than wait on a background pass.
app.reminders.enabled=false
# Tests register many accounts in one shared database; AuthControllerTests checks the closed default.
app.registration-open=true

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Flyway builds the schema and Hibernate checks it against the entities, so a migration can't drift from them.
spring.jpa.hibernate.ddl-auto=validate

app.jwt-secret=test-secret-not-for-production-use-only-in-tests-hs512-min-64-bytes
app.jwt-expiry-days=7
app.internal-token=test-internal-token
