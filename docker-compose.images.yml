# Run from pre-built images: docker compose -f docker-compose.images.yml up -d
# Override IMAGE_PREFIX / IMAGE_TAG in .env to use a fork or pin a version.
services:
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/maddaak}/jobtrackerapp-web:${IMAGE_TAG:-latest}
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    ports: ["5173:443"]
    volumes: ["./certs:/etc/nginx/certs:ro"]
    depends_on: [bff]

  bff:
    image: ${IMAGE_PREFIX:-ghcr.io/maddaak}/jobtrackerapp-bff:${IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      CORE_URL: http://core:8080
      SCRAPER_URL: http://scraper:8081
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS}
      # Daily check for a newer release. Set UPDATE_CHECK=false to stop it calling out.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
    expose: ["3000"]
    depends_on: [core, scraper]

  core:
    image: ${IMAGE_PREFIX:-ghcr.io/maddaak}/jobtrackerapp-core:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS}
    expose: ["8080"]
    depends_on: [postgres, mongo]

  scraper:
    image: ${IMAGE_PREFIX:-ghcr.io/maddaak}/jobtrackerapp-scraper:${IMAGE_TAG:-latest}
    environment:
      PORT: "8081"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
    expose: ["8081"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    expose: ["27017"]
    volumes: ["mongodata:/data/db"]

volumes:
  pgdata:
  mongodata:
